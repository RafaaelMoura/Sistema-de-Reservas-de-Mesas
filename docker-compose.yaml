services:

  postgres:
    image: postgres:15.17
    container_name: postgres-db-bdl
    restart: always

    environment:
      POSTGRES_DB: baldedelixo
      POSTGRES_USER: baldedelixo
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: